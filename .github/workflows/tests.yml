name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # The suite is hermetic: no network, no fixture servers, ~7s (the StockBasis
      # lesson — running the tests bare is safe). Public tree = git ls-files.
      - run: node --test test/*.test.mjs
