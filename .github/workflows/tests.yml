name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # Сьют герметичен: без сети, без фикстур-серверов, ~7с (урок StockBasis —
      # голый прогон тестов безопасен). Публичное дерево = git ls-files.
      - run: node --test test/*.test.mjs
