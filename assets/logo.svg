<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 136 32" role="img" aria-label="Lotwise — corporate actions engine for tokenized equities">
  <!-- Lotwise full logo: mark + wordmark.
       Mark: a stack of tax lots (horizontal bars) on an event axis; the accented bar
       is the lot recomputed by a corporate action (adjusted lot).
       Neutral strokes and the wordmark inherit `color` (currentColor): dark ink on
       light backgrounds, color:#e6edf0 on dark ones. Accent lot is fixed #58a6ff. -->
  <title>Lotwise</title>
  <line x1="5.25" y1="4.75" x2="5.25" y2="27.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="5.25" cy="13" r="2.6" fill="none" stroke="currentColor" stroke-width="1.8"/>
  <rect x="10" y="5" width="17" height="3.5" rx="1.75" fill="currentColor"/>
  <rect x="10" y="11.25" width="20" height="3.5" rx="1.75" fill="#58a6ff" class="accent"/>
  <rect x="10" y="17.5" width="13" height="3.5" rx="1.75" fill="currentColor"/>
  <rect x="10" y="23.75" width="10" height="3.5" rx="1.75" fill="currentColor"/>
  <text x="44" y="23.5" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="0.3" fill="currentColor">Lotwise</text>
</svg>
